spring:
  application:
    name: droso-backend

  # The local defaults of the database live in one file, so that the application, the local
  # launcher and Docker Compose cannot drift apart. The environment variables DB_URL, DB_USERNAME
  # and DB_PASSWORD still win over the values of that file.
  #
  # "db-local.properties" is the working copy of the developer and is ignored by Git; it is
  # created by copying "db-local.example.properties". The example is imported first, so that the
  # working copy wins: the application still starts with the standard defaults when the working
  # copy is missing. "optional:" keeps the application starting when there is neither.
  config:
    import:
      - classpath:db-local.example.properties
      - optional:classpath:db-local.properties

  datasource:
    url: ${DB_URL:jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}}
    username: ${DB_USERNAME:${POSTGRES_USER}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}
    hikari:
      # Bound how long the health check may wait for a connection from the pool.
      connection-timeout: 2000
      validation-timeout: 2000
      maximum-pool-size: 10
      minimum-idle: 1
      # NOTE: the server messages are localized by the "lc_messages" GUC. It must not be set per
      # session here: in PostgreSQL it is a superuser-only parameter, so the option would make
      # the connection of an ordinary role fail with "permission denied to set parameter".
      # The server is therefore started with "lc_messages=C" instead:
      #   - embedded server: see PostgresLauncher
      #   - Docker: see docker-compose.yml

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    # The schema is created and changed by the Flyway migrations only. Hibernate merely verifies
    # on start-up that the entities match the migrated tables, so that a drift fails fast.
    hibernate:
      ddl-auto: validate
    # Do not keep the persistence context open for the whole HTTP request.
    open-in-view: false

  jackson:
    deserialization:
      # Jackson 3 ignores unknown JSON properties by default. They are rejected instead
      # (400 VALIDATION_ERROR naming the property): a client that sends "id" or "status" must not
      # believe it has set them, and a misspelt "priorty" must not silently fall back to MEDIUM.
      fail-on-unknown-properties: true
    datatype:
      enum:
        # Otherwise an enum is also read from its index: "priority": 2 would silently become HIGH.
        fail-on-numbers-for-enums: true

  web:
    # The messages of Bean Validation are part of the error responses. They are interpolated in
    # the locale of the request, so a Russian browser would get "не должно быть пустым" instead of
    # "must not be blank". A fixed locale keeps the API answering in English for every client.
    locale: en
    locale-resolver: fixed

droso:
  auth:
    # Whether anyone may register with POST /api/v1/auth/register (always with the role USER).
    # A deployment without self-registered users sets DROSO_AUTH_REGISTRATION_ENABLED=false.
    registration-enabled: ${DROSO_AUTH_REGISTRATION_ENABLED:true}
    # The refresh tokens (cookie of POST /api/v1/auth/login and /refresh): every refresh issues a new
    # one, valid for the TTL, but the tokens of one login end after the maximum lifetime anyway.
    refresh-token-ttl: 7d
    refresh-token-max-lifetime: 30d
    # The origins of the web pages that may use the API from a browser (comma-separated): the only
    # ones allowed to refresh or log out with the cookie, and the CORS allowlist. The default is the
    # development server of droso-frontend; a deployment sets its own.
    allowed-origins: ${DROSO_AUTH_ALLOWED_ORIGINS:http://localhost:4200}
  # The access tokens (JWT, HS256). The secret has deliberately no entry here: it comes from the
  # environment variable DROSO_JWT_SECRET only (Base64 of at least 32 random bytes, e.g.
  # "openssl rand -base64 32"), and the application does not start without it.
  jwt:
    issuer: droso-backend
    # Short, since a refresh token (droso.auth.refresh-token-ttl) gets the next one.
    access-token-ttl: 15m
  # The first administrator, created on start-up when no active one exists (BootstrapAdminService).
  # Both values come from the environment only and have no default: DROSO_BOOTSTRAP_ADMIN_EMAIL and
  # DROSO_BOOTSTRAP_ADMIN_PASSWORD. Without them the application starts with a warning; with an
  # invalid or already registered email it does not start. Ignored once an administrator exists.
  bootstrap:
    admin:
      email: ${DROSO_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${DROSO_BOOTSTRAP_ADMIN_PASSWORD:}

# Parameters of the health probe.
health:
  timeout-seconds: 2
  query: SELECT 1

management:
  endpoints:
    web:
      exposure:
        # Actuator is used for metrics/logging only; the public health contract is /api/v1/health.
        # Only /actuator/health is open; SecurityConfig denies every other endpoint to everyone until
        # the deployment decides who reads the metrics (a management port or a permission).
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

logging:
  charset:
    # The console of a Windows terminal is not UTF-8 by default, which turns any non-ASCII
    # character of a log record into mojibake.
    console: UTF-8
    file: UTF-8
  level:
    org.example: INFO