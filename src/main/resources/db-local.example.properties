# Local development defaults of the PostgreSQL database.
#
# Copy this file to "db-local.properties" and adjust it:
#   cp src/main/resources/db-local.example.properties src/main/resources/db-local.properties
# (on Windows: copy src\main\resources\db-local.example.properties src\main\resources\db-local.properties)
#
# "db-local.properties" is ignored by Git, because it may contain the credentials of the
# developer's own database. This example file stays in Git and provides the defaults that are
# used when the working copy is missing.
#
# The working copy is the single source of truth of the local database:
#   - the application imports it with "spring.config.import" (see application.yml);
#   - the local launcher reads it from the classpath
#     (see src/test/java/org/example/tools/LocalDatabaseConfig.java);
#   - Docker Compose passes it to the container with "env_file"
#     (see docker-compose.yml), where the postgres image reads exactly these variables.
#
# The names are the ones of the official postgres image, so that the same file works for all three
# consumers. The environment variables DB_URL, DB_USERNAME and DB_PASSWORD override the values
# below; the JDBC URL is composed from them.
POSTGRES_HOST=localhost
POSTGRES_PORT=5432
POSTGRES_DB=stub
POSTGRES_USER=stub
POSTGRES_PASSWORD=stub
